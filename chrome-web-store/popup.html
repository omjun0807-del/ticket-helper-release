<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ticket Helper PC</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div><strong>Ticket Helper PC</strong><span id="version">v-</span></div>
      <span class="badge" id="pageState">확인 중</span>
    </header>
    <section class="hero">
      <b id="themeCount">테마 -개</b>
      <span id="syncState">동기화 상태 확인 중</span>
    </section>
    <button id="openPanel" class="primary" type="button">현재 페이지에서 Ticket Helper 열기</button>
    <section class="store-update">
      <small>업데이트</small>
      <b>Chrome Web Store 자동 업데이트</b>
      <span>새 버전이 승인되면 Chrome/Edge가 자동으로 적용합니다.</span>
    </section>
    <div class="grid">
      <div><small>자동 동기화</small><b id="autoSync">-</b></div>
      <div><small>GitHub 토큰</small><b id="tokenState">-</b></div>
    </div>
    <p>예약자 이름·전화번호는 이 브라우저에만 저장됩니다. 선택한 경우 테마/회차 설정만 사용자의 GitHub 저장소에 동기화합니다.</p>
    <div id="message" role="status"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
