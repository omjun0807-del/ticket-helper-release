<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ticket Helper PC</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><div><strong>Ticket Helper PC</strong><span id="version">v-</span></div><span class="badge" id="pageState">확인 중</span></header>
    <section class="hero"><b id="themeCount">테마 -개</b><span id="syncState">동기화 상태 확인 중</span></section>
    <button id="openPanel" class="primary" type="button">현재 페이지에서 Ticket Helper 열기</button>
    <div class="grid">
      <div><small>자동 동기화</small><b id="autoSync">-</b></div>
      <div><small>GitHub 토큰</small><b id="tokenState">-</b></div>
    </div>
    <p>테마 등록, 회차 설정, GitHub 동기화는 지원 예약 페이지의 Ticket Helper 패널에서 관리합니다.</p>
    <div id="message" role="status"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
